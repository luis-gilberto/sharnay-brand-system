<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jump → Collection Constellation</title>
</head>
<body>
<p style="font-family: Georgia, serif; padding: 2rem;">Preparing Collection…</p>
<script>
(function () {
  var KEY = 'lgs.reading-the-practice.sharnay.v1';
  var now = new Date().toISOString();
  var a = 'Trabajo con luz que no pide permiso.';
  var b =
    'Lo que más me importa es que la persona se reconozca en la fotografía, ' +
    'no que yo demuestre lo que sé hacer con la cámara.';
  var state = {
    index: 19,
    mark: 19,
    lang: 'es',
    answers: {
      9: a,
      13: b
    },
    files: {},
    started: now,
    updated: now,
    completed: false,
    portrait: {
      version: 1,
      fragments: [
        {
          id: 'q:9',
          questionN: 9,
          sectionId: 'voice',
          source: 'answer',
          text: a,
          collectedAt: now,
          lang: 'es'
        },
        {
          id: 'q:13',
          questionN: 13,
          sectionId: 'voice',
          source: 'answer',
          text: b,
          collectedAt: now,
          lang: 'es'
        }
      ]
    },
    orientation: { roomId: 'voice', minutesRemaining: 15 },
    submissionStatus: null,
    submissionId: null,
    readingLine: { revealed: { archive: true, collection: false, exhibition: false } }
  };
  try {
    localStorage.setItem(KEY, JSON.stringify(state));
  } catch (e) {
    document.body.textContent = 'Could not write localStorage: ' + e;
    return;
  }
  location.replace('./index.html');
})();
</script>
</body>
</html>
