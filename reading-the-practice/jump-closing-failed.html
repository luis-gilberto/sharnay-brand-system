<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jump → Cierre (error / pending)</title>
</head>
<body>
<p style="font-family: Georgia, serif; padding: 2rem;">Opening Closing Letter (error / pending)…</p>
<script>
(function () {
  var KEY = 'lgs.reading-the-practice.sharnay.v1';
  var now = new Date().toISOString();
  var state = {
    index: 36,
    mark: 36,
    lang: 'es',
    answers: {},
    files: {},
    started: now,
    updated: now,
    completed: true,
    completedAt: now,
    portrait: { version: 1, fragments: [] },
    orientation: { roomId: null, minutesRemaining: null },
    submissionStatus: 'failed',
    submissionId: null,
    readingLine: { revealed: { archive: true, collection: true, exhibition: true } }
  };
  try {
    sessionStorage.setItem('closingHold', '1');
    localStorage.setItem(KEY, JSON.stringify(state));
  } catch (e) { document.body.textContent = String(e); return; }
  location.replace('./index.html');
})();
</script>
</body>
</html>
