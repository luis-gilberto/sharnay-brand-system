<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jump → Exhibition Gaze</title>
</head>
<body>
<p style="font-family: Georgia, serif; padding: 2rem;">Preparing Exhibition…</p>
<script>
(function () {
  var KEY = 'lgs.reading-the-practice.sharnay.v1';
  var fragment =
    'Lo que más me importa es que la persona se reconozca en la fotografía, ' +
    'no que yo demuestre lo que sé hacer con la cámara.';
  var now = new Date().toISOString();
  var state = {
    index: 33,
    mark: 33,
    lang: 'es',
    answers: {
      21: fragment
    },
    files: {},
    started: now,
    updated: now,
    completed: false,
    portrait: {
      version: 1,
      fragments: [{
        id: 'q:21',
        questionN: 21,
        sectionId: 'exists',
        source: 'answer',
        text: fragment,
        collectedAt: now,
        lang: 'es'
      }]
    },
    orientation: { roomId: 'exists', minutesRemaining: 2 },
    submissionStatus: null,
    submissionId: null,
    readingLine: { revealed: { archive: true, collection: true, exhibition: false } }
  };
  try {
    localStorage.setItem(KEY, JSON.stringify(state));
  } catch (e) {
    document.body.textContent = 'Could not write localStorage: ' + e;
    return;
  }
  location.replace('./index.html');
})();
</script>
</body>
</html>
