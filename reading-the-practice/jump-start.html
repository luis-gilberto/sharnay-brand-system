<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Start · Reading the Practice</title>
</head>
<body>
<p style="font-family: Georgia, serif; padding: 2rem;">Starting the full experience from the beginning…</p>
<script>
(function () {
  var KEY = 'lgs.reading-the-practice.sharnay.v1';
  var now = new Date().toISOString();
  /* Fresh walk: opening screen, Spanish, empty answers.
     Write as you go — Archive appears after chapter I textareas. */
  var state = {
    index: 0,
    mark: 0,
    lang: 'es',
    answers: {},
    files: {},
    started: now,
    updated: now,
    completed: false,
    portrait: { version: 1, fragments: [] },
    orientation: { roomId: null, minutesRemaining: null },
    submissionStatus: null,
    submissionId: null
  };
  try {
    localStorage.setItem(KEY, JSON.stringify(state));
  } catch (e) {
    document.body.textContent = 'Could not write localStorage: ' + e;
    return;
  }
  location.replace('./index.html');
})();
</script>
</body>
</html>
